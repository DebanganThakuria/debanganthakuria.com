<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker></defs>
<rect width="760" height="380" rx="14" fill="#f4e9cf"/>
<rect x="20" y="40" width="180" height="76" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="110" y="66" class="m b c">Your app</text><text x="110" y="86" class="s c">sends a message</text><text x="110" y="104" class="s c"></text>
<rect x="290" y="40" width="180" height="76" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="380" y="66" class="m b c">Any node</text><text x="380" y="86" class="s c">saves it to disk,</text><text x="380" y="104" class="s c">answers 202</text>
<rect x="560" y="40" width="180" height="76" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="650" y="66" class="m b c">Partition owner</text><text x="650" y="86" class="s c">saves it, checks it,</text><text x="650" y="104" class="s c">makes it visible</text>
<line x1="202" y1="78" x2="287" y2="78" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="245" y="70" class="s c">POST</text>
<line x1="472" y1="78" x2="557" y2="78" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="515" y="70" class="s c">later</text>
<line x1="650" y1="118" x2="650" y2="187" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="660" y="158" class="s">consume</text>
<rect x="560" y="190" width="180" height="76" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="650" y="216" class="m b c">A reader</text><text x="650" y="236" class="s c">takes it with</text><text x="650" y="254" class="s c">a lease (30 s)</text>
<rect x="290" y="190" width="180" height="76" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="380" y="216" class="m b c">Ack</text><text x="380" y="236" class="s c">done, never</text><text x="380" y="254" class="s c">delivered again</text>
<line x1="557" y1="228" x2="473" y2="228" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="515" y="220" class="s c">done</text>
<path d="M610 268 C600 330, 700 330, 690 270" fill="none" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<text x="650" y="352" class="s c">no ack in time?</text><text x="650" y="370" class="s c">another reader gets it</text>
<text x="20" y="215" class="s b">A 202 means it's on disk.</text><text x="20" y="235" class="s">It survives any crash</text><text x="20" y="255" class="s">from then on.</text>
</svg>
