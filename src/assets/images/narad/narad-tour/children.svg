<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker></defs>
<rect width="760" height="370" rx="14" fill="#f4e9cf"/>
<rect x="20" y="145" width="200" height="70" rx="10" fill="#d9b56a" stroke="#4b3621" stroke-width="1.5"/><text x="120" y="174" class="m b c">orders</text><text x="120" y="196" class="s c">the parent topic</text>
<rect x="420" y="25" width="320" height="62" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580" y="51" class="m b c">orders-analytics</text><text x="580" y="72" class="s c">fan-out child: a copy right away</text><line x1="222" y1="180" x2="417" y2="56" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="105" width="320" height="62" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580" y="131" class="m b c">orders-later</text><text x="580" y="152" class="s c">delay child: a copy 10 minutes later</text><line x1="222" y1="180" x2="417" y2="136" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="185" width="320" height="62" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580" y="211" class="m b c">orders-replica</text><text x="580" y="232" class="s c">replica child: a copy on other servers</text><line x1="222" y1="180" x2="417" y2="216" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="265" width="320" height="62" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580" y="291" class="m b c">orders on Cluster B</text><text x="580" y="312" class="s c">remote child: a copy on another cluster</text><line x1="222" y1="180" x2="417" y2="296" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="300" class="s">Your apps only write</text><text x="20" y="320" class="s">to the parent. Each child</text><text x="20" y="340" class="s">is read at its own pace.</text>
</svg>
