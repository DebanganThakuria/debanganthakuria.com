<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="320" rx="14" fill="#f4e9cf"/><rect x="20" y="40" width="160" height="70" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="100.0" y="71.0" class="m b c">Producer</text><text x="100.0" y="91.0" class="s c">sends a message</text><rect x="270" y="30" width="210" height="90" rx="10" fill="#d9b56a" stroke="#4b3621" stroke-width="1.5"/><text x="375.0" y="61.0" class="m b c">Write-ahead log</text><text x="375.0" y="81.0" class="s c">on the node it hit</text><text x="375.0" y="101.0" class="s c">fsync #1</text><rect x="560" y="30" width="180" height="90" rx="10" fill="#d9b56a" stroke="#4b3621" stroke-width="1.5"/><text x="650.0" y="61.0" class="m b c">Partition log</text><text x="650.0" y="81.0" class="s c">on the owner</text><text x="650.0" y="101.0" class="s c">fsync #2 + read-back</text><line x1="182" y1="65" x2="267" y2="65" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="267" y1="95" x2="184" y2="95" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="225" y="57" class="s c">send</text><text x="225" y="115" class="s c b g">202</text><line x1="482" y1="75" x2="557" y2="75" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="520" y="67" class="s c">later</text><line x1="650" y1="122" x2="650" y2="187" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="662" y="160" class="s">only now</text><rect x="560" y="190" width="180" height="60" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="650.0" y="216.0" class="m b c">Readers</text><text x="650.0" y="236.0" class="s c">can see it</text><text x="20" y="180" class="m b">One copy, two checkpoints.</text><text x="20" y="204" class="s">If the disk survives,</text><text x="20" y="224" class="s">the data survives.</text><text x="20" y="290" class="s">No replication: the safety comes from the disk, checked twice.</text></svg>
