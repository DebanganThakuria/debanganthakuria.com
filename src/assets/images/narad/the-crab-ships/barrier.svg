<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="330" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="h">A freshly elected Raft leader</text><text x="200" y="80" class="s e b">Raft log</text><text x="200" y="98" class="s e">(what the election checks)</text><rect x="215" y="66" width="525" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="477" y="87" class="s c">complete: every committed entry is here</text><text x="200" y="150" class="s e b">Applied state</text><text x="200" y="168" class="s e">(what the code reads)</text><rect x="215" y="136" width="200" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><rect x="415" y="136" width="325" height="30" rx="4" fill="#efd3b8" stroke="#a34e2f"/><text x="577" y="157" class="s c r">not applied yet: hours behind</text><line x1="415" y1="230" x2="415" y2="172" stroke="#a34e2f" stroke-width="2" marker-end="url(#ar)"/><text x="415" y="250" class="s c r b">Leader decides "these cursors are unused" here.</text><text x="415" y="270" class="s c r">They weren't. 2,106 messages lost.</text><text x="380" y="314" class="s c g b">Fix: a new leader waits (a Raft barrier) until both bars match, then decides.</text></svg>
