<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="350" rx="14" fill="#f4e9cf"/><rect x="20" y="40" width="220" height="64" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="130.0" y="68.0" class="s b c">Readers ack out of order</text><text x="130.0" y="88.0" class="s c">(allowed)</text><rect x="270" y="40" width="220" height="64" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="380.0" y="68.0" class="s b c">The out-of-order set fills</text><text x="380.0" y="88.0" class="s c">(by design)</text><rect x="520" y="40" width="220" height="64" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="630.0" y="68.0" class="s b c">Broker refuses acks: 503</text><text x="630.0" y="88.0" class="s c">(documented)</text><rect x="520" y="210" width="220" height="64" rx="10" fill="#efd3b8" stroke="#a34e2f" stroke-width="1.5"/><text x="630.0" y="238.0" class="s b c">Harness doesn't retry</text><text x="630.0" y="258.0" class="s c">(my bug)</text><rect x="270" y="210" width="220" height="64" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="380.0" y="238.0" class="s b c">Leases run out</text><text x="380.0" y="258.0" class="s c">(as specified)</text><rect x="20" y="210" width="220" height="64" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="130.0" y="238.0" class="s b c">Messages come back</text><text x="130.0" y="258.0" class="s c">(at least once)</text><line x1="242" y1="72" x2="268" y2="72" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="492" y1="72" x2="518" y2="72" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="630" y1="106" x2="630" y2="207" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="518" y1="242" x2="492" y2="242" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="268" y1="242" x2="242" y2="242" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><line x1="130" y1="207" x2="130" y2="107" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="380" y="150" class="m b c">Six correct behaviours,</text><text x="380" y="174" class="m b c">one endless loop</text><text x="380" y="312" class="s c b">The fix: when the set is full, hand out only the one message</text><text x="380" y="332" class="s c b">that is holding everything up. The loop can't form.</text></svg>
