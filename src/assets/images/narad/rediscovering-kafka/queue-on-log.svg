<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="330" rx="14" fill="#f4e9cf"/><rect x="20" y="24" width="720" height="100" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="40" y="54" class="m b">On top: a queue (what your app sees)</text><text x="40" y="80" class="s">Pull a message, ack it. While you work, a timeout hides it from everyone else.</text><text x="40" y="102" class="s">Fan-out: one queue can subscribe to another, each with its own readers.</text><line x1="380" y1="126" x2="380" y2="170" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="392" y="154" class="s">reads from</text><text x="40" y="196" class="m b">Underneath: a durable log (the truth)</text><rect x="60" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="88" y="233" class="s c">0</text><rect x="124" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="152" y="233" class="s c">1</text><rect x="188" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="216" y="233" class="s c">2</text><rect x="252" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="280" y="233" class="s c">3</text><rect x="316" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="344" y="233" class="s c">4</text><rect x="380" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="408" y="233" class="s c">5</text><rect x="444" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="472" y="233" class="s c">6</text><rect x="508" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="536" y="233" class="s c">7</text><rect x="572" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="600" y="233" class="s c">8</text><rect x="636" y="210" width="56" height="34" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="664" y="233" class="s c">9</text><path d="M 668 262 C 600 300, 160 300, 92 262" fill="none" stroke="#4f6b2c" stroke-width="2" marker-end="url(#a)"/><text x="380" y="318" class="s c g b">Replay is just rewinding the offset.</text></svg>
