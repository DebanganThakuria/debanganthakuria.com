<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="352" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="h">Every question had a Kafka answer</text><rect x="20" y="54" width="330" height="46" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="185.0" y="83.0" class="m c">Two nodes both write offset 100?</text><line x1="352" y1="77" x2="417" y2="77" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="54" width="320" height="46" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580.0" y="83.0" class="m b c">One leader per partition</text><rect x="20" y="116" width="330" height="46" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="185.0" y="145.0" class="m c">What if the leader dies?</text><line x1="352" y1="139" x2="417" y2="139" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="116" width="320" height="46" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580.0" y="145.0" class="m b c">Followers with copies on disk</text><rect x="20" y="178" width="330" height="46" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="185.0" y="207.0" class="m c">Who knows which node leads what?</text><line x1="352" y1="201" x2="417" y2="201" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="178" width="320" height="46" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580.0" y="207.0" class="m b c">A metadata layer</text><rect x="20" y="240" width="330" height="46" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="185.0" y="269.0" class="m c">What if nodes join or leave?</text><line x1="352" y1="263" x2="417" y2="263" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="240" width="320" height="46" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="580.0" y="269.0" class="m b c">A rebalancing protocol</text><text x="380" y="330" class="m b c">Each answer was reasonable. Put together, they were Kafka.</text></svg>
