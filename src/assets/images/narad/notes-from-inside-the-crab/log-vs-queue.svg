<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" width="760" height="325"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="325" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="m b">The log: written once, never changes</text><rect x="40" y="50" width="62" height="44" rx="4" fill="#d4c6a6" stroke="#4b3621"/><text x="71" y="70" class="m c b">0</text><text x="71" y="88" class="s c">done</text><rect x="110" y="50" width="62" height="44" rx="4" fill="#d4c6a6" stroke="#4b3621"/><text x="141" y="70" class="m c b">1</text><text x="141" y="88" class="s c">done</text><rect x="180" y="50" width="62" height="44" rx="4" fill="#d4c6a6" stroke="#4b3621"/><text x="211" y="70" class="m c b">2</text><text x="211" y="88" class="s c">done</text><rect x="250" y="50" width="62" height="44" rx="4" fill="#d4c6a6" stroke="#4b3621"/><text x="281" y="70" class="m c b">3</text><text x="281" y="88" class="s c">done</text><rect x="320" y="50" width="62" height="44" rx="4" fill="#d9b56a" stroke="#4b3621"/><text x="351" y="70" class="m c b">4</text><text x="351" y="88" class="s c">leased</text><rect x="390" y="50" width="62" height="44" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="421" y="70" class="m c b">5</text><text x="421" y="88" class="s c">acked</text><rect x="460" y="50" width="62" height="44" rx="4" fill="#d9b56a" stroke="#4b3621"/><text x="491" y="70" class="m c b">6</text><text x="491" y="88" class="s c">leased</text><rect x="530" y="50" width="62" height="44" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="561" y="70" class="m c b">7</text><text x="561" y="88" class="s c"></text><rect x="600" y="50" width="62" height="44" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="631" y="70" class="m c b">8</text><text x="631" y="88" class="s c"></text><rect x="670" y="50" width="62" height="44" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="701" y="70" class="m c b">9</text><text x="701" y="88" class="s c"></text><line x1="316" y1="44" x2="316" y2="112" stroke="#4f6b2c" stroke-width="3"/><text x="310" y="128" class="s e g b">acked up to here</text><rect x="150" y="160" width="460" height="110" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="380" y="188" class="m b c">The queue state: changes all the time</text><text x="380" y="214" class="s c">leased right now: 4 and 6 (each with a timer)</text><text x="380" y="236" class="s c">acked out of order: 5</text><text x="380" y="258" class="s c">everything else: just the one line on the left</text><text x="380" y="305" class="s c b">The log records what was sent. The queue state records what is happening to it.</text></svg>
