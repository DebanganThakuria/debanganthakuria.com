<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="402" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="h">What does "durable" mean?</text><rect x="30" y="260" width="132" height="40" rx="6" fill="#d4c6a6" stroke="#4b3621"/><text x="96" y="232" class="s c b">in memory</text><text x="96" y="250" class="s c">(page cache)</text><rect x="172" y="222" width="132" height="78" rx="6" fill="#ead9b4" stroke="#4b3621"/><text x="238" y="194" class="s c b">fsynced</text><text x="238" y="212" class="s c">on the leader</text><rect x="314" y="184" width="132" height="116" rx="6" fill="#d9b56a" stroke="#4b3621"/><text x="380" y="156" class="s c b">copied to</text><text x="380" y="174" class="s c">a follower</text><rect x="456" y="146" width="132" height="154" rx="6" fill="#c9a35a" stroke="#4b3621"/><text x="522" y="118" class="s c b">fsynced on</text><text x="522" y="136" class="s c">a follower</text><rect x="598" y="108" width="132" height="192" rx="6" fill="#b38a45" stroke="#4b3621"/><text x="664" y="80" class="s c b">fsynced on</text><text x="664" y="98" class="s c">a quorum</text><line x1="40" y1="330" x2="730" y2="330" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="380" y="352" class="s c">safer, and slower</text><text x="380" y="384" class="s c b">Each is a fair definition. Bugs live where two parts of a system pick different ones.</text></svg>
