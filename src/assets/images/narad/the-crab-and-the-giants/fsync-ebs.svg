<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="330" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="m b">Local SSD (the CI runner)</text><text x="130" y="74" class="s e">fsync</text><rect x="140" y="56" width="120" height="28" rx="4" fill="#d9b56a" stroke="#4b3621"/><text x="200" y="75" class="s c">data</text><rect x="260" y="56" width="120" height="28" rx="4" fill="#d4c6a6" stroke="#4b3621"/><text x="320" y="75" class="s c">metadata</text><text x="130" y="114" class="s e">fdatasync</text><rect x="140" y="96" width="120" height="28" rx="4" fill="#d9b56a" stroke="#4b3621"/><text x="200" y="115" class="s c">data</text><text x="400" y="114" class="s g b">about twice as fast</text><text x="20" y="174" class="m b">EBS (the production cluster)</text><text x="130" y="214" class="s e">fsync</text><rect x="140" y="196" width="580" height="28" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="430" y="215" class="s c">one network round trip, about 3 ms</text><text x="130" y="254" class="s e">fdatasync</text><rect x="140" y="236" width="580" height="28" rx="4" fill="#ead9b4" stroke="#4b3621"/><text x="430" y="255" class="s c">one network round trip, about 3 ms</text><text x="380" y="302" class="s c b">On EBS the metadata rides in the same trip, so the two cost the same.</text></svg>
