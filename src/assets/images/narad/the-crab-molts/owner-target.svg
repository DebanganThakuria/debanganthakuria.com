<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="340" rx="14" fill="#f4e9cf"/><rect x="20" y="30" width="230" height="70" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="135.0" y="51.0" class="m b c">Controller</text><text x="135.0" y="71.0" class="s c">(the Raft leader)</text><text x="135.0" y="91.0" class="s c">only writes the plan</text><rect x="330" y="30" width="410" height="70" rx="10" fill="#f4e9cf" stroke="#a0793d" stroke-width="2"/><text x="535" y="58" class="m b c">orders, partition 3</text><text x="470" y="84" class="m c">Owner: A</text><text x="600" y="84" class="m c">Target: C</text><line x1="252" y1="65" x2="327" y2="65" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="290" y="57" class="s c">set Target</text><rect x="20" y="190" width="230" height="70" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="135.0" y="221.0" class="m b c">Node A</text><text x="135.0" y="241.0" class="s c">owner: keeps serving</text><rect x="510" y="190" width="230" height="70" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="625.0" y="221.0" class="m b c">Node C</text><text x="625.0" y="241.0" class="s c">notices it is the Target</text><line x1="252" y1="225" x2="507" y2="225" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="380" y="216" class="s c">copies the data</text><line x1="625" y1="188" x2="625" y2="103" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="613" y="140" class="s e b">flip: Owner = C</text><text x="613" y="158" class="s e">only if still A and C</text><text x="380" y="310" class="s c b">Nobody choreographs anybody. One guarded Raft write finishes the move.</text></svg>
