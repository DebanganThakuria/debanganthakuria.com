<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a34e2f"/></marker></defs><rect width="760" height="310" rx="14" fill="#f4e9cf"/><text x="20" y="34" class="m b">Writes slower than the copy</text><text x="400" y="34" class="m b">Writes faster than the copy</text><rect x="40" y="54" width="240" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="160" y="75" class="s c">pass 1: everything</text><rect x="40" y="98" width="90" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="138" y="119" class="s">pass 2</text><rect x="40" y="142" width="32" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="80" y="163" class="s">pass 3</text><rect x="40" y="186" width="12" height="30" rx="4" fill="#efd3b8" stroke="#a34e2f"/><text x="60" y="207" class="s r b">freeze: a few MiB, ms</text><rect x="420" y="54" width="260" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="550" y="75" class="s c">pass 1: not shrinking</text><rect x="420" y="98" width="260" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="550" y="119" class="s c">pass 2: not shrinking</text><rect x="420" y="142" width="260" height="30" rx="4" fill="#dfe6c8" stroke="#4b3621"/><text x="550" y="163" class="s c">pass 3: not shrinking</text><rect x="420" y="186" width="260" height="30" rx="4" fill="#efd3b8" stroke="#a34e2f"/><text x="550" y="207" class="s c r b">stop chasing, freeze, copy</text><line x1="380" y1="20" x2="380" y2="230" stroke="#c9b48a" stroke-width="1.5"/><text x="380" y="268" class="s c">Produce keeps flowing during every pass. Only the last step freezes,</text><text x="380" y="290" class="s c">and the freeze stops the writes, so it always finishes.</text></svg>
