<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#4b3621}.s{font-size:15px}.m{font-size:17px}.b{font-weight:bold}.h{font-size:19px;font-weight:bold}.r{fill:#a34e2f}.g{fill:#4f6b2c}.c{text-anchor:middle}.e{text-anchor:end}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3621"/></marker></defs>
<rect width="760" height="330" rx="14" fill="#f4e9cf"/>
<rect x="20" y="30" width="280" height="230" rx="12" fill="none" stroke="#a0793d" stroke-width="2" stroke-dasharray="6 4"/><text x="160" y="56" class="h c">Cluster A</text>
<rect x="40" y="75" width="240" height="50" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="160" y="98" class="m b c">topic "orders"</text><text x="160" y="116" class="s c">your apps write here</text>
<line x1="160" y1="127" x2="160" y2="160" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="163" width="240" height="70" rx="10" fill="#f4e9cf" stroke="#4b3621" stroke-width="1.5"/><text x="160" y="188" class="m b c">remote child</text><text x="160" y="208" class="s c">a cursor reads new records,</text><text x="160" y="225" class="s c">a sender ships them</text>
<rect x="460" y="30" width="280" height="230" rx="12" fill="none" stroke="#a0793d" stroke-width="2" stroke-dasharray="6 4"/><text x="600" y="56" class="h c">Cluster B</text>
<rect x="480" y="150" width="240" height="60" rx="10" fill="#ead9b4" stroke="#4b3621" stroke-width="1.5"/><text x="600" y="176" class="m b c">topic "orders"</text><text x="600" y="196" class="s c">a normal topic, readers here</text>
<line x1="282" y1="180" x2="477" y2="180" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="380" y="170" class="s c">batches over HTTPS</text>
<line x1="477" y1="208" x2="284" y2="208" stroke="#4b3621" stroke-width="2" marker-end="url(#a)"/><text x="380" y="228" class="s c">"202, got them"</text>
<text x="380" y="292" class="m b c">The cursor only moves forward after Cluster B says 202.</text>
<text x="380" y="315" class="s c">So a failure can send a record twice, but never skip one.</text>
</svg>
